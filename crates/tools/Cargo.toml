[package]
name = "ocw-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
ocw-engine = { path = "../engine" }
ocw-provider = { path = "../provider" }
ocw-git = { path = "../git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
which = "7"
glob-match = "0.2"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
