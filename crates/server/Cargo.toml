[package]
name = "ocw-server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart", "json"] }
axum-extra = "0.10"
futures-util = "0.3"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "5"
shellexpand = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-tungstenite = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
cron = "0.14"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
sha2 = "0.10"
zip = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

ocw-data = { path = "../data" }
ocw-engine = { path = "../engine" }
ocw-provider = { path = "../provider" }
ocw-skills = { path = "../skills" }
ocw-tools = { path = "../tools" }
ocw-shell = { path = "../shell" }
ocw-git = { path = "../git" }
ocw-connectors = { path = "../connectors" }
lopdf = "0.44.0"
serde_yaml = "0.9.34"
toml = "1.1.4"

[lib]
name = "ocw_server"

[[bin]]
name = "ocw-server"
path = "src/main.rs"
