[package]
name = "ocw-provider"
version = "0.1.0"
description = "OpenWorker provider layer: OpenAI-compatible, Anthropic, Gemini LLM clients"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "2"
once_cell = "1"
base64 = "0.22"
jsonwebtoken = "9"

[dev-dependencies]
tokio-test = "0.4"
