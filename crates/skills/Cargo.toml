[package]
name = "ocw-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
ocw-engine = { path = "../engine" }
uuid = { version = "1", features = ["v4"] }
zip = "2"
parking_lot = "0.12"
