[package]
name = "ocw-data"
version = "0.1.0"
description = "OpenWorker data layer: memory, sessions, conversations, automation"
edition = "2021"
rust-version = "1.77"
license = "MIT"

pyo3 = ["dep:pyo3"]
default = []

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.14"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
parking_lot = "0.12"
once_cell = "1"
dirs = "6"
tokio = { version = "1", features = ["sync", "rt"] }

[dependencies.pyo3]
version = "0.24"
optional = true

[dev-dependencies]
tempfile = "3"
