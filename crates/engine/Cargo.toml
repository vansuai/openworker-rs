[package]
name = "ocw-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
ocw-provider = { path = "../provider" }

[dependencies.pyo3]
version = "0.24"
features = ["auto-initialize"]
