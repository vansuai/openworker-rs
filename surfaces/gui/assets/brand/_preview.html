<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  :root { font-family: 'Manrope', 'Inter', system-ui, -apple-system, sans-serif; }
  body { margin: 0; padding: 40px; background: #F2EFE8; color: #1B2440; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.2px; }
  h1 small { font-weight: 400; opacity: 0.55; margin-left: 8px; font-size: 13px; }
  section { margin-bottom: 36px; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; opacity: 0.55; margin: 0 0 14px; }
  .row { display: flex; gap: 28px; align-items: flex-end; padding: 22px; border-radius: 14px; background: white; box-shadow: 0 1px 0 rgba(0,0,0,.04); flex-wrap: wrap; }
  .row.dark { background: #0E1A2E; color: #F4ECD8; }
  .row.dark h2 { opacity: 0.7; }
  .item { text-align: center; }
  .item .label { font-size: 10px; opacity: 0.55; margin-top: 6px; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .panel { padding: 26px; border-radius: 14px; }
  .panel.light { background: #FFFFFF; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
  .panel.dark  { background: #0E1A2E; color: #F4ECD8; }
  img { display: block; }
  .ink { color: #1B2440; }
  .moonlight { color: #F4ECD8; }
</style>
</head>
<body>
  <h1>望舒 · Vansu <small>brand mark preview</small></h1>

  <section>
    <h2>Primary mark — single color (currentColor)</h2>
    <div class="grid">
      <div class="panel light ink">
        <div class="row" style="background: transparent; box-shadow: none; padding: 8px;">
          <div class="item"><img src="logo-mark.svg" width="144" height="144"><div class="label">144</div></div>
          <div class="item"><img src="logo-mark.svg" width="96"  height="96"><div class="label">96</div></div>
          <div class="item"><img src="logo-mark.svg" width="56"  height="56"><div class="label">56</div></div>
          <div class="item"><img src="logo-mark.svg" width="32"  height="32"><div class="label">32</div></div>
          <div class="item"><img src="logo-mark.svg" width="20"  height="20"><div class="label">20</div></div>
          <div class="item"><img src="logo-mark.svg" width="16"  height="16"><div class="label">16</div></div>
        </div>
      </div>
      <div class="panel dark moonlight">
        <div class="row" style="background: transparent; padding: 8px;">
          <div class="item"><img src="logo-mark.svg" width="144" height="144"></div>
          <div class="item"><img src="logo-mark.svg" width="96"  height="96"></div>
          <div class="item"><img src="logo-mark.svg" width="56"  height="56"></div>
          <div class="item"><img src="logo-mark.svg" width="32"  height="32"></div>
          <div class="item"><img src="logo-mark.svg" width="20"  height="20"></div>
          <div class="item"><img src="logo-mark.svg" width="16"  height="16"></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>Full-color mark (app icon tile)</h2>
    <div class="row">
      <div class="item"><img src="logo-mark-color.svg" width="256" height="256"></div>
      <div class="item"><img src="logo-mark-color.svg" width="128" height="128"></div>
      <div class="item"><img src="logo-mark-color.svg" width="96"  height="96"></div>
      <div class="item"><img src="logo-mark-color.svg" width="64"  height="64"></div>
      <div class="item"><img src="logo-mark-color.svg" width="48"  height="48"></div>
    </div>
  </section>

  <section>
    <h2>Horizontal lockup</h2>
    <div class="panel light">
      <div class="row" style="background: transparent; box-shadow: none; padding: 8px;">
        <div class="item"><img src="logo-lockup.svg" width="440" height="128"><div class="label">440 wide</div></div>
        <div class="item"><img src="logo-lockup.svg" width="220" height="64"><div class="label">220 wide</div></div>
        <div class="item"><img src="logo-lockup.svg" width="132" height="38"><div class="label">132 wide</div></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Stacked lockup</h2>
    <div class="row" style="justify-content: flex-start;">
      <div class="item"><img src="logo-lockup-stacked.svg" width="240" height="288"></div>
      <div class="item"><img src="logo-lockup-stacked.svg" width="144" height="172"></div>
      <div class="item"><img src="logo-lockup-stacked.svg" width="96"  height="115"></div>
    </div>
  </section>

  <section>
    <h2>Favicon (simplified)</h2>
    <div class="row">
      <div class="item"><img src="favicon.svg" width="64" height="64"></div>
      <div class="item"><img src="favicon.svg" width="32" height="32"></div>
      <div class="item"><img src="favicon.svg" width="16" height="16"></div>
    </div>
  </section>

</body>
</html>
